<title>Altas y Bajas - Portones</title>
<style>
  :root{
    --R:#C00000; --N:#1a1a1a; --BG:#f4f5f7; --BO:#e0e2e8; --GT:#6b7280;
    --G:#1D9E75; --A:#EF9F27; --O:#E07B39; --B:#378ADD;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--BG); color:var(--N);
    font-family:Calibri,"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
    font-size:16px;
  }
  header{
    position:sticky; top:0; z-index:20; height:52px; background:var(--N);
    box-shadow:0 2px 8px rgba(0,0,0,.3);
    display:flex; align-items:center; gap:12px; padding:0 14px;
  }
  .badge{
    background:var(--R); color:#fff; font-weight:700; font-size:12px;
    letter-spacing:1.5px; padding:6px 10px; border-radius:2px;
  }
  header h1{color:#fff; font-size:15px; font-weight:600; margin:0; flex:1;}
  #btnVolver{
    background:rgba(255,255,255,.12); color:#fff; border:none; border-radius:4px;
    width:32px; height:32px; font-size:18px; cursor:pointer; display:none;
  }
  main{max-width:520px; margin:0 auto; padding:18px 16px 60px;}
  main.wide{max-width:960px;}
  .view{display:none;}
  .view.active{display:block;}

  .card{
    background:#fff; border:1px solid var(--BO); border-radius:10px;
    padding:18px; margin-bottom:14px;
  }
  .home-btn{
    display:flex; align-items:center; gap:14px; width:100%;
    background:#fff; border:1px solid var(--BO); border-radius:10px;
    padding:18px; margin-bottom:14px; cursor:pointer; text-align:left;
    font-size:16px; font-weight:600; color:var(--N);
  }
  .home-btn .ico{
    width:42px; height:42px; border-radius:8px; display:flex; align-items:center;
    justify-content:center; font-size:20px; color:#fff; flex-shrink:0;
  }
  .home-btn small{display:block; font-weight:400; color:var(--GT); font-size:13px; margin-top:2px;}
  .ico.alta{background:var(--G);}
  .ico.baja{background:var(--R);}
  .ico.listado{background:var(--B);}

  label{display:block; font-size:13px; font-weight:600; margin:14px 0 5px; color:var(--N);}
  input, select, textarea{
    width:100%; padding:12px; font-size:16px; border:1px solid var(--BO);
    border-radius:6px; background:#fff; font-family:inherit;
  }
  textarea{resize:vertical; min-height:60px;}
  .checks{display:flex; gap:18px; margin-top:6px;}
  .checks label{display:flex; align-items:center; gap:7px; font-size:15px; font-weight:400; margin:0;}
  .checks input{width:auto;}

  button.primary{
    width:100%; padding:14px; margin-top:20px; background:var(--R); color:#fff;
    border:none; border-radius:6px; font-size:16px; font-weight:600; cursor:pointer;
  }
  button.primary:disabled{
    background:var(--GT); cursor:not-allowed; opacity:.75;
  }
  button.secondary{
    width:100%; padding:13px; margin-top:10px; background:#fff; color:var(--N);
    border:1px solid var(--BO); border-radius:6px; font-size:15px; font-weight:600; cursor:pointer;
  }
  button.small{
    padding:8px 12px; font-size:13px; border-radius:5px; border:1px solid var(--BO);
    background:#fff; cursor:pointer; font-weight:600;
  }
  button.small.copy{color:var(--B); border-color:var(--B);}

  .badge-estado{
    display:inline-block; padding:3px 9px; border-radius:20px; font-size:12px; font-weight:700;
  }
  .badge-estado.Activo{background:rgba(29,158,117,.13); color:var(--G);}
  .badge-estado.Inactivo{background:rgba(192,0,0,.1); color:var(--R);}
  .badge-estado.Revisar{background:rgba(239,159,39,.15); color:var(--A);}

  .linea-line{
    font-family:"Courier New",monospace; background:#f0f1f3; border:1px solid var(--BO);
    border-radius:6px; padding:10px 12px; font-size:14px; display:flex;
    align-items:center; justify-content:space-between; gap:10px; margin-top:8px;
  }

  #buscador{margin-bottom:14px;}
  .filtros{display:flex; gap:8px; margin-bottom:14px;}
  .filtros select{flex:1;}

  .chofer-item{
    background:#fff; border:1px solid var(--BO); border-radius:8px; padding:14px; margin-bottom:10px;
  }
  .chofer-item .fila-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .chofer-item h3{margin:0 0 4px; font-size:15px;}
  .chofer-item .meta{color:var(--GT); font-size:13px; margin-bottom:6px;}
  .chofer-item .ids{font-size:13px; color:var(--N); margin-top:4px;}

  table.tabla-choferes{width:100%; border-collapse:collapse; background:#fff; border-radius:8px; overflow:hidden;}
  table.tabla-choferes th{
    background:var(--N); color:#fff; font-size:12px; text-align:left; padding:10px 8px;
  }
  table.tabla-choferes td{padding:9px 8px; border-bottom:1px solid var(--BO); font-size:13px; vertical-align:top;}

  .lista-cards{display:block;}
  .lista-tabla{display:none;}
  @media (min-width:900px){
    .lista-cards{display:none;}
    .lista-tabla{display:block;}
  }

  #toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--N); color:#fff; padding:12px 20px; border-radius:8px;
    font-size:14px; opacity:0; pointer-events:none; transition:opacity .25s;
    z-index:100; max-width:90%; text-align:center;
  }
  #toast.show{opacity:1;}
  #toast.err{background:var(--R);}
  #toast.ok{background:var(--G);}

  .empty{text-align:center; color:var(--GT); padding:30px 10px; font-size:14px;}
  .loading{text-align:center; color:var(--GT); padding:30px 10px; font-size:14px;}
  .hint{font-size:12px; color:var(--GT); margin-top:4px;}
</style>
</head>
<body>

<header>
  <button id="btnVolver" onclick="goTo('inicio')">‹</button>
  <span class="badge">GRIFFOULIERE</span>
  <h1 id="tituloHeader">Altas y Bajas - Portones</h1>
</header>

<main id="main">

  <!-- INICIO -->
  <div class="view active" id="view-inicio">
    <div class="card" id="panelPendientes" style="display:none; border-color:var(--A); background:#fffaf0">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px">
        <h3 style="margin:0; font-size:15px">Pendientes de enviar SMS</h3>
        <span class="badge-estado Revisar" id="pendientesCount">0</span>
      </div>
      <p class="hint" style="margin:-4px 0 10px">Ya estan cargados en el sistema, pero todavia no se les mando el SMS de alta al porton.</p>
      <div id="pendientesLista"></div>
    </div>
    <button class="home-btn" onclick="goTo('alta')">
      <span class="ico alta">+</span>
      <span>Nueva Alta<small>Cargar un chofer o personal nuevo en un porton</small></span>
    </button>
    <button class="home-btn" onclick="goTo('baja')">
      <span class="ico baja">&minus;</span>
      <span>Dar de Baja<small>Buscar y desactivar un chofer existente</small></span>
    </button>
    <button class="home-btn" onclick="goTo('listado')">
      <span class="ico listado">≡</span>
      <span>Ver Listado<small>Estado actual de Mendoza y Neuquen</small></span>
    </button>
  </div>

  <!-- ALTA -->
  <div class="view" id="view-alta">
    <div class="card">
      <label>Apellido *</label>
      <input id="altaApellido" placeholder="Ej: Gonzalez">
      <label>Nombre *</label>
      <input id="altaNombre" placeholder="Ej: Juan Carlos">
      <label>Legajo</label>
      <input id="altaLegajo" placeholder="Opcional">
      <label>Grupo</label>
      <select id="altaGrupo">
        <option value="Chofer">Chofer</option>
        <option value="Supervision y Seguridad">Supervision y Seguridad</option>
        <option value="Otro">Otro</option>
      </select>
      <label>Lugar de trabajo</label>
      <select id="altaLugar">
        <option value="MENDOZA">Mendoza</option>
        <option value="NEUQUEN">Neuquen</option>
        <option value="MALARGUE">Malargue</option>
        <option value="OTRO">Otro</option>
      </select>
      <label>Telefono a cargar *</label>
      <input id="altaTelefono" placeholder="Ej: 2614181333" inputmode="numeric">
      <label>Telefono alternativo (opcional, por las dudas)</label>
      <input id="altaTelefonoAlt" placeholder="Opcional" inputmode="numeric">
      <label>Portones a habilitar *</label>
      <div class="checks">
        <label><input type="checkbox" id="altaMza"> Mendoza</label>
        <label><input type="checkbox" id="altaNqn"> Neuquen</label>
      </div>
      <label>Observaciones</label>
      <textarea id="altaObs" placeholder="Opcional"></textarea>
      <label>Cargado por *</label>
      <input id="altaUsuario" placeholder="Tu nombre">
      <button class="primary" id="btnAlta" onclick="enviarAlta()">Dar de alta</button>
    </div>
    <div id="altaResultado"></div>
  </div>

  <!-- BAJA -->
  <div class="view" id="view-baja">
    <div class="card">
      <label>Buscar chofer (apellido, nombre o telefono)</label>
      <input id="bajaBuscar" placeholder="Ej: Gonzalez" oninput="buscarParaBaja(this.value)">
    </div>
    <div id="bajaResultados"></div>
    <div id="bajaConfirmacion"></div>
  </div>

  <!-- LISTADO -->
  <div class="view" id="view-listado">
    <div class="filtros">
      <select id="filtroPorton" onchange="cargarListado()">
        <option value="TODOS">Todos los portones</option>
        <option value="MENDOZA">Mendoza</option>
        <option value="NEUQUEN">Neuquen</option>
      </select>
      <select id="filtroEstado" onchange="cargarListado()">
        <option value="Activo">Activos</option>
        <option value="Inactivo">Inactivos</option>
        <option value="Todos">Todos</option>
      </select>
    </div>
    <input id="listadoBuscar" placeholder="Filtrar por apellido o nombre..." oninput="renderListado()" style="margin-bottom:14px;">
    <div id="listadoContenido"><div class="loading">Cargando...</div></div>
  </div>

</main>

<div id="toast"></div>

<script>
// ============================================================
// CONFIGURACION - pegar aca la URL /exec de tu deploy de Apps Script
// ============================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbxP6oIXbPf6pX2QA4WlBociewLwPx1O_UI3uEplqcH3AsunUKgt0Q9YxSysHy3bunu8/exec';

let listadoCache = [];
let numerosSms = { mza: '', nqn: '' };
let formatosBaja = { mza: '', nqn: '' };

async function cargarConfiguracion() {
  try {
    const data = await apiGet({ action: 'contadores' });
    numerosSms.mza = data.numeroSmsMza || '';
    numerosSms.nqn = data.numeroSmsNqn || '';
    formatosBaja.mza = data.formatoBajaMza || '';
    formatosBaja.nqn = data.formatoBajaNqn || '';
  } catch (err) {
    console.warn('No se pudo leer Contadores', err);
  }
}

// Arma, del lado del cliente, la linea de SMS de baja para un chofer ya en cache,
// usando el formato leido de Contadores (ej. "1234,BTL,{ID}"). Se usa para poder
// abrir la app de mensajes DENTRO del mismo click de "Si, dar de baja" (sin esperar
// la respuesta del servidor), porque el navegador solo deja abrir un enlace sms:
// como continuacion directa de un toque del usuario; si se abre despues de un
// await, muchos celulares lo bloquean en silencio.
// Reemplaza "{ID}" (sin importar mayusculas/minusculas ni espacios adentro de las
// llaves) por el id real. Si no encuentra el placeholder devuelve '' (no manda
// un SMS con el texto roto) en vez de un texto con "{ID}" literal.
function aplicarFormatoBaja(formato, id) {
  if (!formato) return '';
  const texto = formato.trim().replace(/\{\s*ID\s*\}/i, id);
  return texto.indexOf('{') !== -1 ? '' : texto;
}

function lineasBajaCliente(c) {
  const out = { mza: '', nqn: '' };
  if (c.idMza) out.mza = aplicarFormatoBaja(formatosBaja.mza, c.idMza);
  if (c.idNqn) out.nqn = aplicarFormatoBaja(formatosBaja.nqn, c.idNqn);
  return out;
}

// Si el chofer tiene un solo porton con formato de baja configurado, abre el SMS
// ya mismo (gesto del usuario intacto). Si tiene los dos (ej. supervision con
// acceso a ambos portones), no abrimos ninguno solo: se manda uno atras del otro
// y el segundo pisaria al primero, asi que en ese caso queda el flujo manual de
// siempre (boton "Enviar SMS" por cada porton en la tarjeta de confirmacion).
function abrirSmsBajaSiCorresponde(c) {
  const l = lineasBajaCliente(c);
  if (l.mza && !l.nqn) { abrirSms(numerosSms.mza, l.mza); return true; }
  if (l.nqn && !l.mza) { abrirSms(numerosSms.nqn, l.nqn); return true; }
  return false;
}
cargarConfiguracion().then(cargarPendientesInicio);

// ============================================================
// PANEL "PENDIENTES DE ENVIAR SMS" (pantalla de Inicio)
// ============================================================
// Mismo criterio que bloquePortonListado: un chofer Activo con un ID
// asignado en un porton pero cuyo "Aplicado" para ese porton todavia no
// es "Si" esta pendiente de que alguien le mande el SMS de alta. Util
// sobre todo para los choferes que carga solo el agente de correo de
// RRHH (quedan en este estado hasta que Coco entra y manda el SMS).
async function cargarPendientesInicio() {
  const panel = document.getElementById('panelPendientes');
  try {
    const data = await apiGet({ action: 'listar', porton: 'TODOS', estado: 'Activo' });
    const pendientes = [];
    data.choferes.forEach(c => {
      if (c.idMza && c.aplicadoMza !== 'Si') pendientes.push({ c, sufijo: 'Mza', nombrePorton: 'Mendoza', numero: numerosSms.mza, linea: c.lineaMza });
      if (c.idNqn && c.aplicadoNqn !== 'Si') pendientes.push({ c, sufijo: 'Nqn', nombrePorton: 'Neuquen', numero: numerosSms.nqn, linea: c.lineaNqn });
    });
    pendientes.reverse(); // los cargados mas recientemente, primero

    if (pendientes.length === 0) {
      panel.style.display = 'none';
      return;
    }

    document.getElementById('pendientesCount').textContent = pendientes.length;
    document.getElementById('pendientesLista').innerHTML = pendientes.map(p => {
      const campo = 'SMSAlta' + p.sufijo;
      const id = p.sufijo === 'Mza' ? p.c.idMza : p.c.idNqn;
      const idConf = 'pend' + p.sufijo + p.c.uid.replace(/[^a-zA-Z0-9]/g, '');
      return `
        <div class="chofer-item" style="margin-bottom:8px">
          <div class="fila-top">
            <div>
              <h3 style="font-size:14px; margin-bottom:2px">${p.c.apellido}, ${p.c.nombre}</h3>
              <div class="meta" style="margin-bottom:0">${p.nombrePorton} (ID ${id}) &middot; Tel. ${p.c.telVigente || '(sin dato)'}</div>
            </div>
          </div>
          <button class="secondary" style="margin-top:8px; border-color:var(--G); color:var(--G)"
            onclick="darDeAltaListado('${p.c.uid}','${campo}','${p.numero}','${p.linea}','${idConf}')">Dar de Alta (enviar SMS)</button>
          <div id="${idConf}" class="hint" style="margin-top:6px"></div>
        </div>`;
    }).join('');
    panel.style.display = 'block';
  } catch (err) {
    console.warn('No se pudo cargar el panel de pendientes', err);
    panel.style.display = 'none';
  }
}

// Abre la app de mensajes del celular con el numero y el texto ya cargados.
// Un navegador no puede mandar el SMS solo por razones de seguridad del sistema operativo:
// este es el maximo de automatizacion posible, el ultimo toque en "Enviar" lo hace la persona.
function abrirSms(numero, texto) {
  if (!numero) {
    mostrarToast('Falta configurar el numero de SMS de ese porton en la pestaña Contadores', 'err');
    return;
  }
  const url = 'sms:' + numero + '?&body=' + encodeURIComponent(texto);
  window.location.href = url;
}

// ---------- navegacion SPA ----------
function goTo(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + viewId).classList.add('active');
  document.getElementById('btnVolver').style.display = viewId === 'inicio' ? 'none' : 'block';
  const titulos = { inicio: 'Altas y Bajas - Portones', alta: 'Nueva Alta', baja: 'Dar de Baja', listado: 'Listado' };
  document.getElementById('tituloHeader').textContent = titulos[viewId] || '';
  document.getElementById('main').className = viewId === 'listado' ? 'wide' : '';
  if (viewId === 'inicio') cargarPendientesInicio();
  if (viewId === 'listado') cargarListado();
  if (viewId === 'baja') {
    document.getElementById('bajaBuscar').value = '';
    document.getElementById('bajaResultados').innerHTML = '';
    document.getElementById('bajaConfirmacion').innerHTML = '';
  }
  if (viewId === 'alta') {
    document.getElementById('altaResultado').innerHTML = '';
  }
}

// ---------- toast ----------
function mostrarToast(msg, tipo) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + (tipo || '');
  setTimeout(() => { t.className = ''; }, 3200);
}

// ---------- fetch helper (GET + URLSearchParams, nunca POST JSON) ----------
async function apiGet(params) {
  const usp = new URLSearchParams(params);
  const res = await fetch(API_URL + '?' + usp.toString());
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Error desconocido');
  return data;
}

// ---------- copiar al portapapeles ----------
function copiarTexto(texto, btn) {
  navigator.clipboard.writeText(texto).then(() => {
    mostrarToast('Copiado al portapapeles', 'ok');
  }).catch(() => {
    mostrarToast('No se pudo copiar, copialo a mano', 'err');
  });
}

// ============================================================
// ALTA
// ============================================================
async function enviarAlta() {
  // Candado del boton: si ya hay una alta en curso (el usuario toco dos
  // veces seguidas, tipico en celular con la red un poco lenta), el
  // segundo toque no hace nada -- el boton ya quedo deshabilitado apenas
  // se proceso el primero, mas abajo en esta misma funcion.
  const btn = document.getElementById('btnAlta');
  if (btn.disabled) return;

  const apellido = document.getElementById('altaApellido').value.trim();
  const nombre = document.getElementById('altaNombre').value.trim();
  const telefono = document.getElementById('altaTelefono').value.trim();
  const usuario = document.getElementById('altaUsuario').value.trim();
  const portones = [];
  if (document.getElementById('altaMza').checked) portones.push('Mendoza');
  if (document.getElementById('altaNqn').checked) portones.push('Neuquen');

  if (!apellido || !nombre || !telefono || !usuario) {
    mostrarToast('Completa apellido, nombre, telefono y quien carga el alta', 'err');
    return;
  }
  if (portones.length === 0) {
    mostrarToast('Elegi al menos un porton', 'err');
    return;
  }

  // Deshabilitar el boton ANTES del await (no despues): asi el segundo
  // toque, aunque llegue una fraccion de segundo mas tarde, ya encuentra
  // el boton apagado y ni siquiera dispara una segunda llamada al backend.
  const textoOriginal = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Cargando...';

  try {
    const data = await apiGet({
      action: 'alta',
      apellido, nombre,
      legajo: document.getElementById('altaLegajo').value.trim(),
      grupo: document.getElementById('altaGrupo').value,
      lugar: document.getElementById('altaLugar').value,
      telefono,
      telefonoAlt: document.getElementById('altaTelefonoAlt').value.trim(),
      portones: portones.join(','),
      observaciones: document.getElementById('altaObs').value.trim(),
      usuario
    });
    mostrarResultadoAlta(data);
    mostrarToast(
      data.duplicadoEvitado ? 'Este chofer ya se habia cargado hace instantes (se evito duplicarlo)' : 'Alta cargada correctamente',
      'ok'
    );
    cargarPendientesInicio();
  } catch (err) {
    mostrarToast('Error: ' + err.message, 'err');
  } finally {
    // Se re-habilita siempre, tanto si salio bien como si dio error, para
    // no dejar el boton trabado si algo falla (ej. sin señal un instante).
    btn.disabled = false;
    btn.textContent = textoOriginal;
  }
}

function mostrarResultadoAlta(data) {
  const c = data.chofer;
  let html = '<div class="card"><h3 style="margin-top:0">Listo, ' + c.apellido + ' ' + c.nombre + '</h3>';
  html += '<p class="hint">Apreta "Enviar SMS": se abre tu app de mensajes con el numero y el texto ya cargados, ' +
          'vos apretas Enviar ahi. Despues confirma aca para que quede registrado.</p>';
  if (c.lineaMza) {
    html += bloqueSms('Porton Mendoza (ID ' + c.idMza + ')', c.lineaMza, data.numeroSmsMza, c.uid, 'SMSAltaMza', c.smsAltaMza);
  }
  if (c.lineaNqn) {
    html += bloqueSms('Porton Neuquen (ID ' + c.idNqn + ')', c.lineaNqn, data.numeroSmsNqn, c.uid, 'SMSAltaNqn', c.smsAltaNqn);
  }
  html += '</div>';
  document.getElementById('altaResultado').innerHTML = html;
  ['altaApellido','altaNombre','altaLegajo','altaTelefono','altaTelefonoAlt','altaObs'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('altaMza').checked = false;
  document.getElementById('altaNqn').checked = false;
}

// Bloque reutilizable: linea + boton "Enviar SMS" (abre la app de mensajes) + boton "Copiar"
// + confirmacion manual de que el SMS realmente se mando (para trazabilidad).
function bloqueSms(titulo, linea, numero, uid, campoConfirmacion, confirmadoPrevio) {
  const idConf = 'conf' + Math.random().toString(36).slice(2);
  const confirmado = confirmadoPrevio ? confirmadoPrevio : '';
  return `
    <label style="margin-top:14px">${titulo}</label>
    <div class="linea-line"><span>${linea}</span>
      <button class="small copy" onclick="copiarTexto('${linea}')">Copiar</button>
    </div>
    <button class="secondary" style="margin-top:8px; border-color:var(--R); color:var(--R)"
      onclick="abrirSms('${numero}', '${linea}')">Enviar SMS</button>
    <div id="${idConf}" class="hint" style="margin-top:6px">
      ${confirmado
        ? 'SMS confirmado el ' + confirmado
        : `<a href="#" onclick="confirmarEnvioSms('${uid}','${campoConfirmacion}','${idConf}'); return false;">Ya envie el SMS, marcar ✓</a>`}
    </div>
  `;
}

async function confirmarEnvioSms(uid, campo, idConf) {
  try {
    const data = await apiGet({ action: 'confirmarSms', uid, campo });
    document.getElementById(idConf).textContent = 'SMS confirmado el ' + data.confirmado;
    mostrarToast('Confirmado', 'ok');
  } catch (err) {
    mostrarToast('Error: ' + err.message, 'err');
  }
}

// ============================================================
// BAJA
// ============================================================
let bajaTimeout = null;
function buscarParaBaja(q) {
  clearTimeout(bajaTimeout);
  document.getElementById('bajaConfirmacion').innerHTML = '';
  if (!q || q.trim().length < 2) {
    document.getElementById('bajaResultados').innerHTML = '';
    return;
  }
  bajaTimeout = setTimeout(async () => {
    try {
      const data = await apiGet({ action: 'buscar', q: q.trim() });
      renderResultadosBaja(data.choferes);
    } catch (err) {
      mostrarToast('Error buscando: ' + err.message, 'err');
    }
  }, 350);
}

function renderResultadosBaja(choferes) {
  const cont = document.getElementById('bajaResultados');
  const activos = choferes.filter(c => c.estado === 'Activo');
  if (activos.length === 0) {
    cont.innerHTML = '<div class="empty">No se encontraron choferes activos con ese dato.</div>';
    return;
  }
  cont.innerHTML = activos.map(c => `
    <div class="chofer-item">
      <div class="fila-top">
        <div>
          <h3>${c.apellido}, ${c.nombre}</h3>
          <div class="meta">${c.lugarTrabajo} &middot; Tel. ${c.telVigente} &middot; ${c.portonesHabilitados.replace(';', ' / ')}</div>
          <div class="ids">${c.idMza ? 'ID Mendoza: ' + c.idMza + ' &middot; ' : ''}${c.idNqn ? 'ID Neuquen: ' + c.idNqn : ''}</div>
        </div>
        <button class="small" style="border-color:var(--R); color:var(--R)" onclick='confirmarBaja(${JSON.stringify(c)})'>Dar de baja</button>
      </div>
    </div>
  `).join('');
}

function confirmarBaja(c) {
  const cont = document.getElementById('bajaConfirmacion');
  cont.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0">Confirmar baja de ${c.apellido}, ${c.nombre}</h3>
      <label>Motivo (opcional)</label>
      <textarea id="bajaMotivo" placeholder="Ej: fin de contrato, cambio de base, etc."></textarea>
      <button class="primary" onclick='ejecutarBaja("${c.uid}")'>Confirmar baja</button>
      <button class="secondary" onclick='document.getElementById("bajaConfirmacion").innerHTML=""'>Cancelar</button>
    </div>
  `;
}

async function ejecutarBaja(uid) {
  const motivo = document.getElementById('bajaMotivo').value.trim();
  try {
    const data = await apiGet({ action: 'baja', uid, motivo });
    let html = '<div class="card"><h3 style="margin-top:0">Baja registrada: ' + data.apellido + ', ' + data.nombre + '</h3>';
    if (data.instruccionMza) {
      html += data.esSmsMza
        ? bloqueSms('Porton Mendoza', data.instruccionMza, data.numeroSmsMza, data.uid, 'SMSBajaMza', '')
        : '<label style="margin-top:14px">Porton Mendoza</label><div class="linea-line"><span>' + data.instruccionMza + '</span></div>';
    }
    if (data.instruccionNqn) {
      html += data.esSmsNqn
        ? bloqueSms('Porton Neuquen', data.instruccionNqn, data.numeroSmsNqn, data.uid, 'SMSBajaNqn', '')
        : '<label style="margin-top:14px">Porton Neuquen</label><div class="linea-line"><span>' + data.instruccionNqn + '</span></div>';
    }
    html += '</div>';
    document.getElementById('bajaConfirmacion').innerHTML = html;
    document.getElementById('bajaResultados').innerHTML = '';
    document.getElementById('bajaBuscar').value = '';
    mostrarToast('Baja registrada', 'ok');
  } catch (err) {
    mostrarToast('Error: ' + err.message, 'err');
  }
}

// ============================================================
// LISTADO
// ============================================================
async function cargarListado() {
  document.getElementById('listadoContenido').innerHTML = '<div class="loading">Cargando...</div>';
  try {
    const porton = document.getElementById('filtroPorton').value;
    const estado = document.getElementById('filtroEstado').value;
    const data = await apiGet({ action: 'listar', porton, estado });
    listadoCache = data.choferes;
    renderListado();
  } catch (err) {
    document.getElementById('listadoContenido').innerHTML = '<div class="empty">Error: ' + err.message + '</div>';
  }
}

function buscarEnCache(uid) {
  return listadoCache.find(c => c.uid === uid);
}

// Bloque de estado por porton dentro de una tarjeta del listado:
// - si ya esta cargado en el equipo -> linea compacta verde, sin botones.
// - si todavia dice "cargar" (pendiente) -> boton grande "Dar de Alta" (arma y abre el SMS).
function bloquePortonListado(c, sufijo, nombrePorton, numero) {
  const linea = sufijo === 'Mza' ? c.lineaMza : c.lineaNqn;
  const id = sufijo === 'Mza' ? c.idMza : c.idNqn;
  const aplicado = sufijo === 'Mza' ? c.aplicadoMza : c.aplicadoNqn;
  const smsFecha = sufijo === 'Mza' ? c.smsAltaMza : c.smsAltaNqn;
  if (!linea) return '';

  if (aplicado === 'Si') {
    return `<div class="linea-line" style="background:rgba(29,158,117,.08); border-color:rgba(29,158,117,.3)">
      <span>${nombrePorton} (ID ${id}) &middot; <strong style="color:var(--G)">Cargado</strong></span>
      <button class="small copy" onclick="copiarTexto('${linea}')">Copiar</button>
    </div>`;
  }

  const idConf = 'conf' + sufijo + c.uid.replace(/[^a-zA-Z0-9]/g, '');
  return `
    <label style="margin-top:14px">${nombrePorton} (ID ${id}) &middot; <span style="color:var(--A)">pendiente de cargar</span></label>
    <div class="linea-line"><span>${linea}</span>
      <button class="small copy" onclick="copiarTexto('${linea}')">Copiar</button>
    </div>
    <button class="secondary" style="margin-top:8px; border-color:var(--G); color:var(--G)"
      onclick="darDeAltaListado('${c.uid}','SMS${sufijo === 'Mza' ? 'AltaMza' : 'AltaNqn'}','${numero}','${linea}','${idConf}')">Dar de Alta (enviar SMS)</button>
    <div id="${idConf}" class="hint" style="margin-top:6px">
      ${smsFecha ? 'SMS confirmado el ' + smsFecha : ''}
    </div>
  `;
}

// Abre el SMS y deja el link de confirmacion, igual que bloqueSms, pero ademas
// al confirmar actualiza el cache local y vuelve a pintar el listado.
function darDeAltaListado(uid, campo, numero, linea, idConf) {
  abrirSms(numero, linea);
  document.getElementById(idConf).innerHTML =
    `<a href="#" onclick="confirmarAltaListado('${uid}','${campo}'); return false;">Ya envie el SMS, marcar ✓</a>`;
}

async function confirmarAltaListado(uid, campo) {
  try {
    const data = await apiGet({ action: 'confirmarSms', uid, campo });
    const c = buscarEnCache(uid);
    if (c) {
      if (campo === 'SMSAltaMza') { c.aplicadoMza = 'Si'; c.smsAltaMza = data.confirmado; }
      if (campo === 'SMSAltaNqn') { c.aplicadoNqn = 'Si'; c.smsAltaNqn = data.confirmado; }
    }
    mostrarToast('Alta confirmada', 'ok');
    renderListado();
    cargarPendientesInicio();
  } catch (err) {
    mostrarToast('Error: ' + err.message, 'err');
  }
}

// ---- Baja desde el listado, con confirmacion obligatoria (por si se aprieta sin querer) ----
function pedirBajaListado(uid) {
  const c = buscarEnCache(uid);
  if (c) c._confirmBaja = true;
  renderListado();
}

function cancelarBajaListado(uid) {
  const c = buscarEnCache(uid);
  if (c) c._confirmBaja = false;
  renderListado();
}

async function confirmarBajaListado(uid) {
  const motivoEl = document.getElementById('motivoListado-' + uid);
  const motivo = motivoEl ? motivoEl.value.trim() : '';
  const c0 = buscarEnCache(uid);
  // Abrir el SMS ACA, antes del await, para no perder el gesto del usuario (el click en "Si, dar de baja").
  if (c0) abrirSmsBajaSiCorresponde(c0);
  try {
    const data = await apiGet({ action: 'baja', uid, motivo });
    const c = buscarEnCache(uid);
    if (c) {
      c._confirmBaja = false;
      c.estado = 'Inactivo';
      c._bajaResultado = data;
    }
    mostrarToast('Baja registrada', 'ok');
    renderListado();
  } catch (err) {
    mostrarToast('Error: ' + err.message, 'err');
  }
}

async function confirmarEnvioBajaListado(uid, campo, idConf) {
  try {
    const data = await apiGet({ action: 'confirmarSms', uid, campo });
    const c = buscarEnCache(uid);
    if (c) {
      if (campo === 'SMSBajaMza') c.aplicadoMza = 'No';
      if (campo === 'SMSBajaNqn') c.aplicadoNqn = 'No';
    }
    document.getElementById(idConf).textContent = 'SMS confirmado el ' + data.confirmado;
    mostrarToast('Confirmado', 'ok');
  } catch (err) {
    mostrarToast('Error: ' + err.message, 'err');
  }
}

// Tarjeta completa de un chofer en el listado (mobile)
function renderCardListado(c) {
  let html = `<div class="chofer-item" id="card-${c.uid}">
    <div class="fila-top">
      <div>
        <h3>${c.apellido}, ${c.nombre}</h3>
        <div class="meta">${c.lugarTrabajo} &middot; ${c.grupo} &middot; Tel. ${c.telVigente || '(sin dato)'}</div>
      </div>
      <span class="badge-estado ${c.estado}">${c.estado}</span>
    </div>`;

  html += bloquePortonListado(c, 'Mza', 'Mendoza', numerosSms.mza);
  html += bloquePortonListado(c, 'Nqn', 'Neuquen', numerosSms.nqn);

  if (c.estado === 'Activo') {
    if (c._confirmBaja) {
      html += `
        <div class="card" style="margin-top:12px; background:#fff7f7; border-color:var(--R)">
          <strong>¿Confirmas dar de baja a ${c.apellido}, ${c.nombre}?</strong>
          <label>Motivo (opcional)</label>
          <textarea id="motivoListado-${c.uid}" placeholder="Ej: fin de contrato"></textarea>
          <button class="primary" style="background:var(--R)" onclick="confirmarBajaListado('${c.uid}')">Si, dar de baja</button>
          <button class="secondary" onclick="cancelarBajaListado('${c.uid}')">Cancelar</button>
        </div>`;
    } else if (c._editando) {
      html += formularioEditarTelefono(c);
    } else if (!c._bajaResultado && !c._editResultado) {
      html += `
        <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap">
          <button class="small" style="border-color:var(--B); color:var(--B)"
            onclick="pedirEditarTelefono('${c.uid}')">Editar telefono</button>
          <button class="small" style="border-color:var(--R); color:var(--R)"
            onclick="pedirBajaListado('${c.uid}')">Dar de baja</button>
        </div>`;
    }
  }

  if (c._bajaResultado) {
    const d = c._bajaResultado;
    html += '<div class="card" style="margin-top:12px; background:#f7f9fb"><strong>Baja registrada</strong>';
    if (d.instruccionMza) {
      html += d.esSmsMza
        ? bloqueSms('Porton Mendoza', d.instruccionMza, d.numeroSmsMza, c.uid, 'SMSBajaMza', '')
        : '<label style="margin-top:10px">Porton Mendoza</label><div class="linea-line"><span>' + d.instruccionMza + '</span></div>';
    }
    if (d.instruccionNqn) {
      html += d.esSmsNqn
        ? bloqueSms('Porton Neuquen', d.instruccionNqn, d.numeroSmsNqn, c.uid, 'SMSBajaNqn', '')
        : '<label style="margin-top:10px">Porton Neuquen</label><div class="linea-line"><span>' + d.instruccionNqn + '</span></div>';
    }
    html += '</div>';
  }

  // Resultado de "Editar telefono": primero la baja del ID viejo, despues el
  // alta del ID nuevo -- en ese orden, porque asi hay que mandar los SMS.
  if (c._editResultado) {
    const b = c._editResultado.baja;
    const nc = c._editResultado.alta.chofer;
    const na = c._editResultado.alta;
    html += '<div class="card" style="margin-top:12px; background:#f5f9fd; border-color:var(--B)">' +
            '<strong>Telefono corregido</strong>' +
            '<p class="hint">Mandá primero la baja del numero viejo y recien despues el alta del numero nuevo, en ese orden.</p>';
    if (b.instruccionMza) {
      html += b.esSmsMza
        ? bloqueSms('1) Baja Mendoza — numero viejo', b.instruccionMza, b.numeroSmsMza, b.uid, 'SMSBajaMza', '')
        : '<label style="margin-top:10px">1) Baja Mendoza — numero viejo</label><div class="linea-line"><span>' + b.instruccionMza + '</span></div>';
    }
    if (b.instruccionNqn) {
      html += b.esSmsNqn
        ? bloqueSms('1) Baja Neuquen — numero viejo', b.instruccionNqn, b.numeroSmsNqn, b.uid, 'SMSBajaNqn', '')
        : '<label style="margin-top:10px">1) Baja Neuquen — numero viejo</label><div class="linea-line"><span>' + b.instruccionNqn + '</span></div>';
    }
    if (nc.lineaMza) {
      html += bloqueSms('2) Alta Mendoza — numero nuevo (ID ' + nc.idMza + ')', nc.lineaMza, na.numeroSmsMza, nc.uid, 'SMSAltaMza', nc.smsAltaMza);
    }
    if (nc.lineaNqn) {
      html += bloqueSms('2) Alta Neuquen — numero nuevo (ID ' + nc.idNqn + ')', nc.lineaNqn, na.numeroSmsNqn, nc.uid, 'SMSAltaNqn', nc.smsAltaNqn);
    }
    html += '</div>';
  }

  html += '</div>';
  return html;
}

// ---- Editar telefono: dar de baja el ID actual y dar de alta uno nuevo
// con el telefono corregido (mismos datos personales). Reutiliza baja() y
// alta() tal cual ya funcionan -- no hace falta un endpoint nuevo. ----

function formularioEditarTelefono(c) {
  return `
    <div class="card" style="margin-top:12px; background:#f5f9fd; border-color:var(--B)">
      <strong>Corregir telefono de ${c.apellido}, ${c.nombre}</strong>
      <p class="hint">Esto da de baja el ID actual (${[c.idMza, c.idNqn].filter(Boolean).join(' / ')}) y carga
        un ID nuevo con el telefono corregido en los mismos portones habilitados. El sistema arma los dos SMS
        (baja del viejo, alta del nuevo) para que los mandes en ese orden.</p>
      <label>Telefono correcto *</label>
      <input id="editTel-${c.uid}" value="${c.telVigente || ''}" inputmode="numeric">
      <label>Telefono alternativo</label>
      <input id="editTelAlt-${c.uid}" value="${c.telWP || ''}" placeholder="Opcional" inputmode="numeric">
      <label>Motivo (opcional)</label>
      <textarea id="editMotivo-${c.uid}" placeholder="Ej: numero mal cargado, cambio de chip, etc."></textarea>
      <label>Editado por *</label>
      <input id="editUsuario-${c.uid}" placeholder="Tu nombre">
      <button class="primary" id="btnEditar-${c.uid}" onclick="confirmarEditarTelefono('${c.uid}')">Confirmar correccion</button>
      <button class="secondary" onclick="cancelarEditarTelefono('${c.uid}')">Cancelar</button>
    </div>`;
}

function pedirEditarTelefono(uid) {
  const c = buscarEnCache(uid);
  if (c) c._editando = true;
  renderListado();
}

function cancelarEditarTelefono(uid) {
  const c = buscarEnCache(uid);
  if (c) c._editando = false;
  renderListado();
}

// Nucleo compartido: da de baja el registro actual y carga uno nuevo con el
// telefono corregido. Lo usan tanto el formulario del celular (lee inputs
// del DOM) como el flujo de escritorio (usa prompt()).
async function ejecutarEdicionTelefono(uid, telefono, telefonoAlt, motivo, usuario) {
  const c = buscarEnCache(uid);
  if (!c) throw new Error('No se encontro el chofer en la lista cargada.');
  if (!telefono) throw new Error('Falta el telefono correcto.');
  if (!usuario) throw new Error('Falta indicar quien hace la correccion.');

  const idsViejos = [c.idMza, c.idNqn].filter(Boolean).join('/');
  const motivoTexto = 'Correccion de telefono' + (motivo ? ': ' + motivo : '') + ' (reemplazado por alta nueva)';

  // 1) Baja del registro actual -- retira el/los ID viejo(s) de los portones.
  const dataBaja = await apiGet({ action: 'baja', uid: c.uid, motivo: motivoTexto });

  // 2) Alta nueva con los mismos datos personales y los mismos portones,
  // pero telefono corregido -- el backend le asigna un ID nuevo solo.
  const portones = (c.portonesHabilitados || '').split(';').filter(Boolean);
  const dataAlta = await apiGet({
    action: 'alta',
    apellido: c.apellido,
    nombre: c.nombre,
    legajo: c.legajo || '',
    grupo: c.grupo || 'Chofer',
    lugar: c.lugarTrabajo || '',
    telefono,
    telefonoAlt: telefonoAlt || '',
    portones: portones.join(','),
    observaciones: (c.observaciones ? c.observaciones + ' | ' : '') +
      'Reemplaza ID(s) anterior(es) ' + (idsViejos || '(sin ID previo)') + ' por correccion de telefono' + (motivo ? ': ' + motivo : ''),
    usuario
  });

  c._editando = false;
  c.estado = 'Inactivo';
  c._editResultado = { baja: dataBaja, alta: dataAlta };
  listadoCache.push(dataAlta.chofer);
}

async function confirmarEditarTelefono(uid) {
  const btn = document.getElementById('btnEditar-' + uid);
  if (btn.disabled) return;

  const telefono = document.getElementById('editTel-' + uid).value.trim();
  const telefonoAlt = document.getElementById('editTelAlt-' + uid).value.trim();
  const motivo = document.getElementById('editMotivo-' + uid).value.trim();
  const usuario = document.getElementById('editUsuario-' + uid).value.trim();

  btn.disabled = true;
  const textoOriginal = btn.textContent;
  btn.textContent = 'Procesando...';

  try {
    await ejecutarEdicionTelefono(uid, telefono, telefonoAlt, motivo, usuario);
    mostrarToast('Telefono corregido: mandá los dos SMS que quedaron listos (baja del viejo, alta del nuevo)', 'ok');
    renderListado();
    cargarPendientesInicio();
  } catch (err) {
    mostrarToast('Error: ' + err.message, 'err');
    btn.disabled = false;
    btn.textContent = textoOriginal;
  }
}

// Version escritorio (tabla): pide los datos con prompt() en vez de un
// formulario, igual que ya hacen las acciones de la tabla para dar de baja.
async function editarTelefonoTabla(uid, nombreCompleto) {
  const telefono = prompt('Telefono correcto para ' + nombreCompleto + ':');
  if (telefono === null || !telefono.trim()) return;
  const usuario = prompt('¿Quien hace esta correccion?');
  if (usuario === null || !usuario.trim()) return;
  const motivo = prompt('Motivo (opcional):') || '';

  try {
    await ejecutarEdicionTelefono(uid, telefono.trim(), '', motivo.trim(), usuario.trim());
    mostrarToast('Telefono corregido: revisa la tarjeta del chofer para mandar los dos SMS', 'ok');
    renderListado();
    cargarPendientesInicio();
  } catch (err) {
    mostrarToast('Error: ' + err.message, 'err');
  }
}

function renderListado() {
  const q = (document.getElementById('listadoBuscar').value || '').toLowerCase();
  const filtrados = listadoCache.filter(c =>
    !q || (c.apellido + ' ' + c.nombre).toLowerCase().indexOf(q) !== -1
  );
  const cont = document.getElementById('listadoContenido');
  if (filtrados.length === 0) {
    cont.innerHTML = '<div class="empty">Sin resultados.</div>';
    return;
  }

  const cards = filtrados.map(renderCardListado).join('');

  const filas = filtrados.map(c => `
    <tr>
      <td>${c.apellido}</td><td>${c.nombre}</td><td>${c.lugarTrabajo}</td>
      <td>${c.idMza || '-'}${c.idMza ? (c.aplicadoMza === 'Si' ? ' ✓' : ' (pend.)') : ''}</td>
      <td>${c.idNqn || '-'}${c.idNqn ? (c.aplicadoNqn === 'Si' ? ' ✓' : ' (pend.)') : ''}</td>
      <td>${c.telVigente}</td>
      <td><span class="badge-estado ${c.estado}">${c.estado}</span></td>
      <td style="white-space:nowrap">
        ${c.lineaMza && c.aplicadoMza !== 'Si' ? '<button class="small" style="border-color:var(--G);color:var(--G)" onclick="darDeAltaListadoTabla(\'' + c.uid + '\',\'SMSAltaMza\',\'' + numerosSms.mza + '\',\'' + c.lineaMza + '\')" title="Dar de alta Mendoza">Alta MZA</button>' : ''}
        ${c.lineaNqn && c.aplicadoNqn !== 'Si' ? '<button class="small" style="border-color:var(--G);color:var(--G)" onclick="darDeAltaListadoTabla(\'' + c.uid + '\',\'SMSAltaNqn\',\'' + numerosSms.nqn + '\',\'' + c.lineaNqn + '\')" title="Dar de alta Neuquen">Alta NQN</button>' : ''}
        ${c.estado === 'Activo' ? '<button class="small" style="border-color:var(--B);color:var(--B)" onclick="editarTelefonoTabla(\'' + c.uid + '\',\'' + (c.apellido + ', ' + c.nombre).replace(/'/g, "\\'") + '\')">Editar tel.</button>' : ''}
        ${c.estado === 'Activo' ? '<button class="small" style="border-color:var(--R);color:var(--R)" onclick="bajaListadoTabla(\'' + c.uid + '\',\'' + (c.apellido + ', ' + c.nombre).replace(/'/g, "\\'") + '\')">Dar de baja</button>' : ''}
      </td>
    </tr>
  `).join('');

  cont.innerHTML =
    '<div class="lista-cards">' + cards + '</div>' +
    '<div class="lista-tabla"><table class="tabla-choferes"><thead><tr>' +
    '<th>Apellido</th><th>Nombre</th><th>Lugar</th><th>ID MZA</th><th>ID NQN</th><th>Telefono</th><th>Estado</th><th>Acciones</th>' +
    '</tr></thead><tbody>' + filas + '</tbody></table></div>';
}

// Version tabla (desktop): confirmacion nativa del navegador para no exigir tanto espacio.
function darDeAltaListadoTabla(uid, campo, numero, linea) {
  abrirSms(numero, linea);
  setTimeout(() => {
    if (confirm('¿Confirmas que enviaste el SMS de alta?')) {
      confirmarAltaListado(uid, campo);
    }
  }, 300);
}

function bajaListadoTabla(uid, nombreCompleto) {
  if (!confirm('¿Confirmas dar de baja a ' + nombreCompleto + '? Esta accion desactiva sus portones.')) return;
  const c0 = buscarEnCache(uid);
  // Abrir el SMS ACA, apenas se confirma el dialogo nativo, para no perder el gesto del usuario.
  if (c0) abrirSmsBajaSiCorresponde(c0);
  confirmarBajaListadoDirecta(uid);
}

async function confirmarBajaListadoDirecta(uid) {
  try {
    const data = await apiGet({ action: 'baja', uid, motivo: '' });
    const c = buscarEnCache(uid);
    if (c) { c.estado = 'Inactivo'; c._bajaResultado = data; }
    mostrarToast('Baja registrada', 'ok');
    renderListado();
  } catch (err) {
    mostrarToast('Error: ' + err.message, 'err');
  }
}
</script>
